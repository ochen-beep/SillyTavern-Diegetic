<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Diegetic panel harness</title>
<script src="jquery-3.5.1.min.js"></script>
<style>
  /* Грубая имитация тёмной темы SillyTavern */
  body { margin: 0; min-height: 100vh; background: #1a1a1e; color: #ddd;
    font-family: "Noto Sans", "Segoe UI", sans-serif; font-size: 13px; }
  #send_form { position: fixed; left: 0; right: 260px; bottom: 0; padding: 8px 12px; flex-direction: column;
    background: #222226; border-top: 1px solid rgba(255,255,255,.12); display: flex; gap: 8px; }
  #send_form textarea { flex: 1; background: #2a2a30; color: #ddd; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; }
  .qr--bar { display: flex; align-items: center; padding: 0 12px; background: #222226;
    border-top: 1px solid rgba(255,255,255,.12); position: fixed; left: 0; right: 260px; bottom: 96px; height: 34px; }
  .qr--buttons { display: flex; gap: 4px; }
  .qr--button { padding: 4px 10px; border-radius: 6px; background: #2a2a30; cursor: pointer; }
  .mes { max-width: 720px; margin: 18px auto; padding: 12px 16px; background: #222228; border-radius: 10px; }
  .mes .mes_text { line-height: 1.5; }
  :root { --SmartThemeBlurTintColor: #1e1e24; --SmartThemeBodyColor: #dcdce2;
    --SmartThemeBorderColor: rgba(255,255,255,.16); --SmartThemeEmColor: #c9a86a; --black30: rgba(0,0,0,.25); --black300: #16161a; }
</style>
</head>
<body>
<div id="send_form">
  <div id="qr--bar"><div class="qr--buttons"></div></div>
  <textarea placeholder="Сообщение…"></textarea>
</div>
<div class="mes" mesid="3"><div class="mes_text">Она молча взяла телефон и вышла из комнаты.

Дверь закрылась, оставив меня в тишине.</div></div>
<script>
// ── Стабы API раннера ──
const ART = '<body style="font-family:sans-serif;padding:10px;background:#233;border-radius:8px;color:#cde">📱 экран телефона (фейк-артефакт)</body>';
const RESP = '<!--DIEGETIC {"pulse":true,"type":"messenger","anchor":"взяла телефон"}-->\n```html\n' + ART + '\n```';
const messages = {
  3: { message_id: 3, role: 'assistant', message: 'Она молча взяла телефон и вышла из комнаты.\n\nДверь закрылась, оставив меня в тишине.', swipes: ['x'], swipe_id: 0 },
};
let chatVars = { dg_meta: { abcd1234: { generatedAt: Date.now(), artifacts: [
  { id: 'a1', type: 'messenger', status: 'ok', anchor: 'взяла телефон' },
  { id: 'a2', type: 'note', status: 'fuzzy', anchor: 'записка на столе' },
  { id: 'a3', type: 'polaroid', status: 'orphan', anchor: 'фото' },
] } } };
globalThis.tavern_events = { MESSAGE_RECEIVED: 1, MESSAGE_SWIPED: 2, MESSAGE_UPDATED: 3, CHAT_CHANGED: 4 };
globalThis.getChatMessages = (range) => {
  const s = String(range);
  if (s === '0-9999') return Object.values(messages);
  return [messages[s]].filter(Boolean);
};
globalThis.setChatMessages = async (updates) => { for (const u of updates) messages[u.message_id] = { ...messages[u.message_id], ...u }; };
globalThis.generateRaw = async () => RESP;
globalThis.stopGenerationById = () => {};
globalThis.getVariables = () => chatVars;
globalThis.insertOrAssignVariables = (vars) => {
  for (const [k, v] of Object.entries(vars)) {
    if (v && typeof v === 'object' && chatVars[k] && typeof chatVars[k] === 'object' && !Array.isArray(v)) Object.assign(chatVars[k], v);
    else chatVars[k] = v;
  }
};
globalThis.getTavernRegexes = async () => [];
globalThis.replaceTavernRegexes = async () => {};
globalThis.eventOn = () => {};
globalThis.toastr = { success: (m) => console.log('toast:', m), error: (m) => console.log('toast-err:', m) };
// Connection Manager стаб — контекст-константа, чтобы обёртки на sendRequest были видимы
window.__stCtx = {
  extensionSettings: { connectionManager: { profiles: [{ id: 'cm-prof-1', name: 'Грок-эндпоинт' }, { id: 'cm-prof-2', name: 'Локальный' }] } },
  ConnectionManagerRequestService: { sendRequest: async () => ({ choices: [{ message: { content: RESP } }] }) },
};
window.SillyTavern = { getContext: () => window.__stCtx };
</script>
<script src="diegetic.js"></script>
</body>
</html>
